name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved site source
        run: |
          cat transfer/site.zip.part-* > source.zip
          mkdir source
          unzip -q source.zip -d source
          rm -f source/.git
          rm -rf source/db source/worker source/examples source/drizzle source/build
          rm -f source/drizzle.config.ts source/vite.config.ts
          python3 - <<'PY'
          from pathlib import Path

          header = Path("source/app/components/Header.tsx")
          text = header.read_text(encoding="utf-8")
          text = text.replace('<Link href="/#teachers">Преподаватели</Link>', '<a href="/bit-music-studio/#teachers">Преподаватели</a>')
          text = text.replace('<Link href="/#process">Первое занятие</Link>', '<a href="/bit-music-studio/#process">Первое занятие</a>')
          text = text.replace('<Link href="/#diagnostic">Бесплатная диагностика</Link>', '<a href="/bit-music-studio/#diagnostic">Бесплатная диагностика</a>')
          text = text.replace(
              '<Link className="button button--green button--compact" href="/#diagnostic">\n'
              '            Записаться\n'
              '          </Link>',
              '<a className="button button--green button--compact" href="/bit-music-studio/#diagnostic">\n'
              '            Записаться\n'
              '          </a>',
          )
          header.write_text(text, encoding="utf-8")

          profile = Path("source/app/teachers/[slug]/page.tsx")
          text = profile.read_text(encoding="utf-8")
          text = text.replace(
              '<Link className="back-link" href="/#teachers">\n'
              '                ← Все преподаватели\n'
              '              </Link>',
              '<a className="back-link" href="/bit-music-studio/#teachers">\n'
              '                ← Все преподаватели\n'
              '              </a>',
          )
          text = text.replace('<Link href="/#teachers">Все преподаватели</Link>', '<a href="/bit-music-studio/#teachers">Все преподаватели</a>')
          text = text.replace('<Link href="/#process">Первое бесплатное занятие</Link>', '<a href="/bit-music-studio/#process">Первое бесплатное занятие</a>')
          profile.write_text(text, encoding="utf-8")
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install and build
        working-directory: source
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npx next build --webpack

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
