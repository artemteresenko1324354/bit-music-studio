name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved site source
        run: |
          cat transfer/site.zip.part-* > source.zip
          mkdir source
          unzip -q source.zip -d source
          rm -f source/.git
          rm -rf source/db source/worker source/examples source/drizzle
          rm -f source/drizzle.config.ts

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package-lock.json

      - name: Install and build
        working-directory: source
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          npm ci
          npx next build --webpack

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/out

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
